<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Poem | VersePoetry</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f7f4fb;color:#292238;margin:0}.card{max-width:760px;margin:45px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 18px #0001}h1{color:#512878;margin-bottom:20px}label{display:block;font-weight:bold;margin:16px 0 8px}input,textarea{width:100%;padding:12px;border:1px solid #d8c9e5;border-radius:7px;font:inherit}textarea{min-height:260px;resize:vertical}.btn{margin-top:18px;padding:11px 16px;border:0;border-radius:7px;background:#512878;color:white;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}.cancel{background:#777}.flash{padding:12px;background:#ffe7e7;color:#a21b1b;border-radius:7px}@media(max-width:600px){.card{margin:20px;padding:20px}}</style></head><body><main class="card"><h1>Edit Poem</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST"><label for="title">Poem Title</label><input id="title" name="title" value="{{ poem.title }}" required><label for="content">Poem Content</label><textarea id="content" name="content" required>{{ poem.content }}</textarea><button class="btn" type="submit">Save Changes</button><a class="btn cancel" href="{{ url_for('admin_panel') }}">Cancel</a></form></main></body></html>
